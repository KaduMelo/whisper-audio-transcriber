[project]
name = "whisper-transcriber"
version = "0.1.0"
description = "CLI tool that transcribes audio files locally using Whisper"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai-whisper>=20240930",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
